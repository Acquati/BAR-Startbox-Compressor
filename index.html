<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BAR Startbox Compressor</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>BAR Startbox Compressor</h1>
      <span>zlib + base64url (mapmetadata_startbox_override)</span>
      <div class="actions">
        <button class="secondary" id="btnExample">Load example</button>
        <button id="btnCompress">Compress &amp; Copy</button>
        <a
          class="btn-github"
          href="https://github.com/Acquati/BAR-Startbox-Compressor"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Source on GitHub"
          title="Source on GitHub"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 16 16"
            width="16"
            height="16"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
        </a>
      </div>
    </header>

    <main>
      <div class="pane pane-left" id="paneLeft">
        <div class="pane-header">
          <span>JSON Input</span>
          <span class="status" id="inputStatus"></span>
        </div>
        <textarea
          id="input"
          spellcheck="false"
          placeholder='Paste your startboxes JSON here…

{
  "startboxes": [
    {
      "poly": [
        {"x": 0, "y": 0},
        {"x": 200, "y": 0},
        {"x": 200, "y": 50},
        {"x": 0, "y": 50}
      ]
    }
  ]
}'
        ></textarea>
        <div class="hint">Coords are integers on the 0–200 grid. One poly per team.</div>
      </div>

      <div class="splitter-v" id="splitterV" title="Drag to resize"></div>

      <div class="pane pane-right" id="paneRight">
        <div class="right-top" id="rightTop">
          <div class="pane-header">
            <span>Compressed Output</span>
            <span class="status" id="outputStatus"></span>
          </div>
          <textarea
            id="output"
            readonly
            spellcheck="false"
            placeholder="Result appears here…"
          ></textarea>
          <div class="hint">Ready to paste into the lobby / game chat</div>
        </div>

        <div class="splitter-h" id="splitterH" title="Drag to resize"></div>

        <div class="right-bottom" id="rightBottom">
          <div class="map-section">
            <div class="map-toolbar">
              <label>
                Load image
                <input type="file" id="mapImageInput" accept="image/*" />
              </label>
              <button
                class="secondary"
                id="btnClearImage"
                style="padding: 5px 10px; font-size: 0.75rem"
              >
                Clear img
              </button>
              <button
                id="btnTeam1"
                style="padding: 5px 10px; font-size: 0.75rem; background: #059669"
              >
                Team 1
              </button>
              <button class="secondary" id="btnTeam2" style="padding: 5px 10px; font-size: 0.75rem">
                Team 2
              </button>
              <button class="secondary" id="btnTeam3" style="padding: 5px 10px; font-size: 0.75rem">
                Team 3
              </button>
              <button class="secondary" id="btnTeam4" style="padding: 5px 10px; font-size: 0.75rem">
                Team 4
              </button>
              <button
                class="secondary"
                id="btnUndoSquare"
                style="padding: 5px 10px; font-size: 0.75rem"
              >
                Undo
              </button>
              <button
                class="secondary"
                id="btnClearSquares"
                style="padding: 5px 10px; font-size: 0.75rem"
              >
                Clear squares
              </button>
              <span class="coord-display" id="coordDisplay">Team 1 — click to place 2×2</span>
            </div>
            <div class="map-frame-wrap" id="mapFrame">
              <div class="placeholder">
                Load a minimap image<br />then click to place 2×2 squares
              </div>
              <img id="mapImage" alt="" />
              <canvas
                id="mapCanvas"
                style="
                  position: absolute;
                  inset: 0;
                  width: 100%;
                  height: 100%;
                  pointer-events: none;
                "
              ></canvas>
              <div class="click-marker" id="clickMarker"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
