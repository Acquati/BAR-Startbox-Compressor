<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BAR Startbox Compressor</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>BAR Startbox Compressor</h1>
      <span>zlib + base64url (mapmetadata_startbox_override)</span>
      <div class="actions">
        <button class="secondary" id="btnExample">Load example</button>
        <button id="btnCompress">Compress &amp; Copy</button>
      </div>
    </header>

    <main>
      <div class="pane pane-left" id="paneLeft">
        <div class="pane-header">
          <span>JSON Input</span>
          <span class="status" id="inputStatus"></span>
        </div>
        <textarea
          id="input"
          spellcheck="false"
          placeholder='Paste your startboxes JSON here…

{
  "startboxes": [
    {
      "poly": [
        {"x": 0, "y": 0},
        {"x": 200, "y": 0},
        {"x": 200, "y": 50},
        {"x": 0, "y": 50}
      ]
    }
  ]
}'
        ></textarea>
        <div class="hint">Coords are integers on the 0–200 grid. One poly per team.</div>
      </div>

      <div class="splitter-v" id="splitterV" title="Drag to resize"></div>

      <div class="pane pane-right" id="paneRight">
        <div class="right-top" id="rightTop">
          <div class="pane-header">
            <span>Compressed Output</span>
            <span class="status" id="outputStatus"></span>
          </div>
          <textarea
            id="output"
            readonly
            spellcheck="false"
            placeholder="Result appears here…"
          ></textarea>
          <div class="hint">Ready to paste into the lobby / game chat</div>
        </div>

        <div class="splitter-h" id="splitterH" title="Drag to resize"></div>

        <div class="right-bottom" id="rightBottom">
          <div class="map-section">
            <div class="map-toolbar">
              <label>
                Load image
                <input type="file" id="mapImageInput" accept="image/*" />
              </label>
              <button
                class="secondary"
                id="btnClearImage"
                style="padding: 5px 10px; font-size: 0.75rem"
              >
                Clear img
              </button>
              <button
                id="btnTeam1"
                style="padding: 5px 10px; font-size: 0.75rem; background: #059669"
              >
                Team 1
              </button>
              <button class="secondary" id="btnTeam2" style="padding: 5px 10px; font-size: 0.75rem">
                Team 2
              </button>
              <button class="secondary" id="btnTeam3" style="padding: 5px 10px; font-size: 0.75rem">
                Team 3
              </button>
              <button class="secondary" id="btnTeam4" style="padding: 5px 10px; font-size: 0.75rem">
                Team 4
              </button>
              <button
                class="secondary"
                id="btnUndoSquare"
                style="padding: 5px 10px; font-size: 0.75rem"
              >
                Undo
              </button>
              <button
                class="secondary"
                id="btnClearSquares"
                style="padding: 5px 10px; font-size: 0.75rem"
              >
                Clear squares
              </button>
              <span class="coord-display" id="coordDisplay">Team 1 — click to place 2×2</span>
            </div>
            <div class="map-frame-wrap" id="mapFrame">
              <div class="placeholder">
                Load a minimap image<br />then click to place 2×2 squares
              </div>
              <img id="mapImage" alt="" />
              <canvas
                id="mapCanvas"
                style="
                  position: absolute;
                  inset: 0;
                  width: 100%;
                  height: 100%;
                  pointer-events: none;
                "
              ></canvas>
              <div class="click-marker" id="clickMarker"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
